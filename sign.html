<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign your inspection agreement</title>
<!-- The client's page for a link sent from the app: a pre-inspection
     agreement to sign (supabase/remote-signing.sql), or a treatment quote to
     accept or decline (supabase/client-link.sql). No account: the link's id
     is the key, and the page only calls rpc/get_sign_request,
     rpc/submit_sign_request and rpc/decline_sign_request. -->
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #0d1117; --ink2: #3d4a57; --ink3: #5d6b78;
    --line: #dde3e9; --accent: #0f766e; --accent-light: #e6f6f4; --error: #b42318;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.55; font-size: 16px; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }
  .head { margin-bottom: 18px; }
  .company { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
  h1 { font-size: 24px; line-height: 1.25; margin: 4px 0 6px; }
  .meta { color: var(--ink2); font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .clause { position: relative; padding-left: 34px; margin: 0 0 16px; }
  .clause-num { position: absolute; left: 0; top: 1px; width: 24px; height: 22px; border-radius: 6px; background: var(--accent-light); color: var(--accent); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .clause h2 { font-size: 16px; margin-bottom: 4px; }
  .clause p, .intro { color: var(--ink2); font-size: 15px; margin-bottom: 6px; }
  .close { font-weight: 600; background: var(--accent-light); border-left: 3px solid var(--accent); padding: 12px 14px; border-radius: 8px; margin-top: 8px; }
  label.field { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  input[type=text] { width: 100%; font: inherit; padding: 12px; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 16px; font-size: 15px; color: var(--ink2); }
  .check input { width: 22px; height: 22px; margin-top: 1px; flex: none; }
  .pad { position: relative; border: 1.5px dashed var(--line); border-radius: 10px; background: #fff; touch-action: none; }
  .pad canvas { display: block; width: 100%; height: 160px; }
  .pad span { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink3); pointer-events: none; }
  .clear { background: none; border: 0; color: var(--accent); font: inherit; font-size: 14px; padding: 12px 0; min-height: 44px; cursor: pointer; }
  .btn { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; margin-top: 4px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .err { color: var(--error); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .state { text-align: center; padding: 40px 20px; }
  .state h1 { margin-bottom: 8px; }
  .state p { color: var(--ink2); }
  .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; margin: 0 auto 16px; font-size: 28px; }
  .foot { text-align: center; color: var(--ink3); font-size: 13px; margin-top: 24px; }
  /* Quote */
  .card h2.sec { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
  .purpose { background: var(--accent-light); border-left: 3px solid var(--accent); padding: 12px 14px; border-radius: 8px; color: var(--ink2); font-size: 15px; }
  .item { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item:last-of-type { border-bottom: 0; }
  .item-desc { font-weight: 600; font-size: 15px; }
  .item-detail { color: var(--ink2); font-size: 14px; margin-top: 2px; }
  .item-qty { color: var(--ink3); font-size: 13px; margin-top: 2px; }
  .item-amt { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .totals { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .totals div { display: flex; justify-content: space-between; color: var(--ink2); font-size: 14px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .totals .grand { color: var(--ink); font-weight: 700; font-size: 18px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .fact { background: var(--accent-light); border-radius: 8px; padding: 10px 12px; }
  .fact small { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 2px; }
  .fact b { font-size: 14px; }
  .sub { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink3); font-weight: 700; margin: 12px 0 6px; }
  ol.steps, ul.steps { padding-left: 22px; color: var(--ink2); font-size: 15px; }
  ol.steps li, ul.steps li { margin-bottom: 6px; }
  .note { color: var(--ink3); font-size: 13.5px; margin-top: 10px; }
  .docs a { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 0; color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--line); }
  .docs a:last-child { border-bottom: 0; }
  .accept-text { font-size: 15px; color: var(--ink2); margin-bottom: 14px; }
  .btn.secondary { background: none; color: var(--ink2); border: 1px solid var(--line); margin-top: 10px; font-weight: 600; }
  textarea { width: 100%; font: inherit; padding: 12px; min-height: 96px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; resize: vertical; }
  .decline { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; }
  .decline p { color: var(--ink2); font-size: 15px; margin-bottom: 10px; }
  .btn.danger { background: #fff; color: var(--error); border: 1.5px solid var(--error); }
  .foot a { color: var(--ink3); }
</style>
</head>

<div class="wrap" id="app">
  <div class="card state"><p>Loading…</p></div>
</div>
<script>
const SUPABASE_URL = 'https://bmjgvogxutwyeklxxeao.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtamd2b2d4dXR3eWVrbHh4ZWFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NTczMTEsImV4cCI6MjEwNTAzMzMxMX0.Ov8xGhDMuAbUcWy7zbCiS01D6QCrlhDYxza3Fzls83U';
const app = document.getElementById('app');
const id = new URLSearchParams(location.search).get('id') || '';

function rpc(name, body) {
  return fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify(body),
  }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function showState(title, text, done, more) {
  app.textContent = '';
  const c = el('div', 'card state');
  if (done) c.appendChild(el('div', 'tick', '✓'));
  c.append(el('h1', null, title), el('p', null, text));
  if (more) { const m = el('p', 'note', more); m.style.marginTop = '12px'; c.appendChild(m); }
  app.appendChild(c);
}

function formatAUD(n) {
  const v = isFinite(n) ? +n : 0;
  return v.toLocaleString('en-AU', { style: 'currency', currency: 'AUD' });
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso.length === 10 ? iso + 'T00:00:00' : iso);
  return isNaN(d) ? iso : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
}

// Same blocks as the app: "N. Heading" clauses, other paragraphs plain.
function renderText(parent, text) {
  let sawClause = false;
  String(text || '').split(/\n\s*\n/).forEach(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) return;
    const m = lines[0].match(/^(\d+)\.\s+(.+)$/);
    if (m) {
      sawClause = true;
      const sec = el('section', 'clause');
      sec.append(el('span', 'clause-num', m[1]), el('h2', null, m[2]));
      lines.slice(1).forEach(l => sec.appendChild(el('p', null, l)));
      parent.appendChild(sec);
    } else {
      lines.forEach(l => parent.appendChild(el('p', sawClause ? 'close' : 'intro', l)));
    }
  });
}

function makePad(canvas, hint, onChange) {
  const ctx = canvas.getContext('2d');
  let drawing = false, last = null, ink = 0;
  function size() {
    const r = canvas.getBoundingClientRect(), s = window.devicePixelRatio || 1;
    canvas.width = r.width * s; canvas.height = r.height * s;
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0c121c';
  }
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener('pointerdown', e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ink += Math.hypot(p.x - last.x, p.y - last.y); last = p;
    hint.style.display = 'none';
  });
  const end = () => { if (drawing) { drawing = false; onChange(); } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  size();
  return {
    // A tap or a dot doesn't count as a signature.
    signed: () => ink >= 24,
    clear: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ink = 0; hint.style.display = ''; onChange(); },
    png: () => canvas.toDataURL('image/png'),
  };
}

function renderForm(doc) {
  app.textContent = '';
  const head = el('div', 'head');
  if (doc.company) head.appendChild(el('div', 'company', doc.company));
  head.appendChild(el('h1', null, 'Pre-inspection agreement'));
  const meta = [doc.address, doc.inspectionDate && `Inspection ${formatDate(doc.inspectionDate)}`].filter(Boolean).join(' · ');
  if (meta) head.appendChild(el('p', 'meta', meta));
  app.appendChild(head);

  const textCard = el('div', 'card');
  renderText(textCard, doc.text);
  app.appendChild(textCard);

  const form = el('div', 'card');
  const nameLabel = el('label', 'field', 'Your full name');
  nameLabel.htmlFor = 'name';
  const name = el('input');
  name.type = 'text'; name.id = 'name'; name.autocomplete = 'name'; name.value = doc.client || '';
  const check = el('label', 'check');
  const agree = el('input'); agree.type = 'checkbox';
  check.append(agree, el('span', null, 'I have read this agreement and agree to it.'));
  const padLabel = el('div', 'field', 'Sign here');
  padLabel.style.cssText = 'font-size:14px;font-weight:600;margin-bottom:6px';
  const padWrap = el('div', 'pad');
  const canvas = el('canvas'); const hint = el('span', null, 'Sign with your finger');
  padWrap.append(canvas, hint);
  const clear = el('button', 'clear', 'Clear signature'); clear.type = 'button';
  const btn = el('button', 'btn', 'Sign agreement'); btn.type = 'button'; btn.disabled = true;
  const err = el('p', 'err');
  form.append(nameLabel, name, check, padLabel, padWrap, clear, btn, err);
  app.appendChild(form);

  const update = () => { btn.disabled = !(name.value.trim() && agree.checked && pad.signed()); };
  const pad = makePad(canvas, hint, update);
  name.addEventListener('input', update);
  agree.addEventListener('change', update);
  clear.addEventListener('click', () => pad.clear());

  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'Signing…'; err.textContent = '';
    try {
      const res = await rpc('submit_sign_request', { p_id: id, p_name: name.value.trim(), p_signature: pad.png(),
        p_meta: { userAgent: navigator.userAgent.slice(0, 300), tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '' } });
      if (res === 'signed' || res === 'already_signed') {
        showState('Signed, thank you', `${doc.company || 'Your inspector'} has your signed agreement. You can close this page.`, true);
      } else if (res === 'expired') {
        showState('This link has expired', `Please ask ${doc.company || 'your inspector'} to send a new one.`);
      } else if (res === 'cancelled') {
        showState('This agreement was withdrawn', `Please contact ${doc.company || 'your inspector'}.`);
      } else {
        throw new Error(res);
      }
    } catch (e) {
      err.textContent = 'That didn’t go through. Check your connection and try again.';
      btn.textContent = 'Sign agreement'; update();
    }
  });
}


// ── The quote ─────────────────────────────────────────────────────────────
// doc = { kind:'quote', company, client, address, number, date, validUntil,
//   inspector, gst, items:[{desc, detail, qty, unit, price, total}],
//   subtotal, gstAmount, total, problem, plan:{time, service, inspections,
//   we:[], owner:[]}, exclusions:[], notes:[], paymentTerms, files:{report,
//   quote}, acceptText }. Everything the quote PDF says, laid out for a phone.
function renderQuote(doc) {
  document.title = 'Your treatment quote';
  app.textContent = '';
  const head = el('div', 'head');
  if (doc.company) head.appendChild(el('div', 'company', doc.company));
  head.appendChild(el('h1', null, 'Treatment quote'));
  const meta = [doc.address, doc.number && `Quote ${doc.number}`, doc.validUntil && `Valid until ${formatDate(doc.validUntil)}`].filter(Boolean).join(' · ');
  if (meta) head.appendChild(el('p', 'meta', meta));
  app.appendChild(head);

  const card = (title) => { const c = el('div', 'card'); if (title) c.appendChild(el('h2', 'sec', title)); app.appendChild(c); return c; };

  if (doc.problem) card().appendChild(el('p', 'purpose', doc.problem));

  const scope = card('Scope of works');
  (doc.items || []).forEach(it => {
    const row = el('div', 'item');
    const left = el('div');
    left.appendChild(el('div', 'item-desc', it.desc || 'Work'));
    if (it.detail) left.appendChild(el('div', 'item-detail', it.detail));
    const qty = [it.qty, it.unit].filter(v => v != null && String(v).trim() !== '').join(' ');
    if (qty && !(String(it.qty) === '1' && !it.unit)) left.appendChild(el('div', 'item-qty', `${qty} × ${formatAUD(it.price)}`));
    row.append(left, el('div', 'item-amt', formatAUD(it.total)));
    scope.appendChild(row);
  });
  const totals = el('div', 'totals');
  const line = (k, v, cls) => { const d = el('div', cls); d.append(el('span', null, k), el('span', null, v)); totals.appendChild(d); };
  if (doc.gst !== false) { line('Subtotal (ex GST)', formatAUD(doc.subtotal)); line('GST (10%)', formatAUD(doc.gstAmount)); }
  line(doc.gst !== false ? 'Total inc GST' : 'Total', formatAUD(doc.total), 'grand');
  scope.appendChild(totals);
  if (doc.paymentTerms) { const n = el('p', 'note', doc.paymentTerms); n.style.whiteSpace = 'pre-line'; scope.appendChild(n); }

  const plan = doc.plan || {};
  const facts = [['Time on site', plan.time], ['Free service period', plan.service], ['Inspections after', plan.inspections]].filter(([, v]) => v);
  if (facts.length || (plan.we || []).length || (plan.owner || []).length) {
    const c = card('Treatment plan');
    if (facts.length) {
      const grid = el('div', 'facts');
      facts.forEach(([k, v]) => { const f = el('div', 'fact'); f.append(el('small', null, k), el('b', null, v)); grid.appendChild(f); });
      c.appendChild(grid);
    }
    const steps = (label, list, ordered) => {
      if (!list || !list.length) return;
      c.appendChild(el('div', 'sub', label));
      const ul = el(ordered ? 'ol' : 'ul', 'steps');
      list.forEach(t => ul.appendChild(el('li', null, t)));
      c.appendChild(ul);
    };
    steps('What we will do', plan.we, true);
    steps('What we ask you to do', plan.owner, false);
    if (plan.service && !/^none$/i.test(plan.service.trim())) {
      c.appendChild(el('p', 'note', 'During the free service period, if termites return to the treated areas we will come back and treat them at no charge. This only applies while the recommended timber pest inspections are carried out and the steps asked of you above are done.'));
    }
  }
  if ((doc.exclusions || []).length) {
    const c = card('Exclusions and work by others');
    const ul = el('ul', 'steps'); doc.exclusions.forEach(t => ul.appendChild(el('li', null, t))); c.appendChild(ul);
  }
  if ((doc.notes || []).length) {
    const c = card('Terms and notes');
    doc.notes.forEach(t => c.appendChild(el('p', 'note', t)));
  }
  const files = doc.files || {};
  if (files.report || files.quote) {
    const c = card('Your documents');
    const docs = el('div', 'docs');
    const link = (href, text) => { const a = el('a', null, '⬇  ' + text); a.href = href; a.target = '_blank'; a.rel = 'noopener'; docs.appendChild(a); };
    if (files.report) link(files.report, 'Inspection report (PDF)');
    if (files.quote) link(files.quote, 'Treatment quote (PDF)');
    c.appendChild(docs);
  }

  // Accept, or decline.
  const form = card('Your answer');
  const acceptText = doc.acceptText || `I accept this quote of ${formatAUD(doc.total)}${doc.gst !== false ? ' (inc GST)' : ''} and authorise the work described above.`;
  const nameLabel = el('label', 'field', 'Your full name'); nameLabel.htmlFor = 'name';
  const name = el('input'); name.type = 'text'; name.id = 'name'; name.autocomplete = 'name'; name.value = doc.client || '';
  const check = el('label', 'check');
  const agree = el('input'); agree.type = 'checkbox';
  check.append(agree, el('span', null, acceptText));
  const padLabel = el('div', 'field', 'Sign here');
  const padWrap = el('div', 'pad');
  const canvas = el('canvas'); const hint = el('span', null, 'Sign with your finger');
  padWrap.append(canvas, hint);
  const clear = el('button', 'clear', 'Clear signature'); clear.type = 'button';
  const btn = el('button', 'btn', 'Accept quote'); btn.type = 'button'; btn.disabled = true;
  const err = el('p', 'err');
  const declineBtn = el('button', 'btn secondary', 'I don’t want to go ahead'); declineBtn.type = 'button';
  form.append(nameLabel, name, check, padLabel, padWrap, clear, btn, err, declineBtn);

  const decline = el('div', 'decline'); decline.hidden = true;
  decline.appendChild(el('p', null, `Let ${doc.company || 'your inspector'} know you’re not going ahead. A reason helps, but isn’t needed.`));
  const noteLabel = el('label', 'field', 'Reason (optional)'); noteLabel.htmlFor = 'declineNote';
  const note = el('textarea'); note.id = 'declineNote'; note.placeholder = 'e.g. Going with another company';
  const sendDecline = el('button', 'btn danger', 'Decline quote'); sendDecline.type = 'button';
  const derr = el('p', 'err');
  decline.append(noteLabel, note, sendDecline, derr);
  form.appendChild(decline);

  const update = () => { btn.disabled = !(name.value.trim() && agree.checked && pad.signed()); };
  const pad = makePad(canvas, hint, update);
  name.addEventListener('input', update);
  agree.addEventListener('change', update);
  clear.addEventListener('click', () => pad.clear());
  declineBtn.addEventListener('click', () => { decline.hidden = !decline.hidden; if (!decline.hidden) note.focus(); });
  const meta_ = () => ({ userAgent: navigator.userAgent.slice(0, 300), tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '' });
  const who = doc.company || 'Your inspector';

  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'Sending…'; err.textContent = '';
    try {
      const res = await rpc('submit_sign_request', { p_id: id, p_name: name.value.trim(), p_signature: pad.png(), p_meta: meta_() });
      if (res === 'signed' || res === 'already_signed') {
        showState('Quote accepted, thank you', `${who} has your acceptance and will be in touch to arrange the work. You can close this page.`, true);
      } else if (res === 'expired') showState('This link has expired', `Please ask ${who} to send a new one.`);
      else if (res === 'cancelled') showState('This quote was withdrawn', `Please contact ${who}.`);
      else throw new Error(res);
    } catch (e) {
      err.textContent = 'That didn’t go through. Check your connection and try again.';
      btn.textContent = 'Accept quote'; update();
    }
  });
  sendDecline.addEventListener('click', async () => {
    if (!name.value.trim()) { derr.textContent = 'Enter your name above first.'; name.focus(); return; }
    sendDecline.disabled = true; sendDecline.textContent = 'Sending…'; derr.textContent = '';
    try {
      const res = await rpc('decline_sign_request', { p_id: id, p_name: name.value.trim(), p_note: note.value.trim() || null, p_meta: meta_() });
      if (res === 'declined') showState('Thanks for letting us know', `${who} has your answer. You can close this page.`, true);
      else if (res === 'already_signed') showState('Already accepted', 'This quote was already accepted from this link.', true);
      else if (res === 'expired') showState('This link has expired', `Please ask ${who} to send a new one.`);
      else if (res === 'cancelled') showState('This quote was withdrawn', `Please contact ${who}.`);
      else throw new Error(res);
    } catch (e) {
      derr.textContent = 'That didn’t go through. Check your connection and try again.';
      sendDecline.disabled = false; sendDecline.textContent = 'Decline quote';
    }
  });
}

(async () => {
  if (!/^[0-9a-f-]{36}$/i.test(id)) { showState('This link isn’t complete', 'Please open the full link you were sent.'); return; }
  try {
    const r = await rpc('get_sign_request', { p_id: id });
    const doc = (r && r.doc) || {};
    const quote = doc.kind === 'quote';
    const thing = quote ? 'quote' : 'agreement';
    const who = doc.company || 'your inspector';
    if (!r) showState(`${quote ? 'Quote' : 'Agreement'} not found`, 'Please open the full link you were sent, or ask your inspector for a new one.');
    else if (r.status === 'signed') showState(quote ? 'Quote accepted' : 'Already signed', `${quote ? 'Accepted' : 'Signed'} by ${r.signer_name} on ${formatDate(r.signed_at)}. There’s nothing more to do.`, true);
    else if (r.status === 'declined') showState('Quote declined', `You let ${who} know on ${formatDate(r.signed_at)} that you’re not going ahead.`, false, r.note ? `Your note: ${r.note}` : '');
    else if (r.status === 'expired') showState('This link has expired', `Please ask ${who} to send a new one.`);
    else if (r.status === 'cancelled') showState(`This ${thing} was withdrawn`, `Please contact ${who}.`);
    else if (quote) renderQuote(doc);
    else renderForm(doc);
  } catch (e) {
    showState('Couldn’t load it', 'Check your connection and open the link again.');
  }
})();
</script>
